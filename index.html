<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidtermAct2</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="landing.html">
                Kittie Yippie
            </a>
            <span class="navbar1-text text-white">
                Log in/ Sign Up
            </span>
        </div>
    </nav>

    <main class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">
        <header class="text-center mb-4">
            <h1 class="fw-bold text-primary">
                LOG IN / SIGN UP
            </h1>
            <p class="text-secondary">
                Please fill up the requirements needed.
            </p>
        </header>

        <div class="alert alert-info alert-dismissible fade show w-100"
             style="max-width: 400px;"
             role="alert">
            <strong>Welcome!</strong>
            Please fill up information needed.

        </div>

        <div class="card border-0 shadow-lg form-container"
             style="width: 100%; max-width: 400px;">
            <div class="card-body p-4">
                <input type="radio"
                       id="tab-login"
                       name="form-toggle"
                       checked
                       hidden>
                <input type="radio"
                       id="tab-signup"
                       name="form-toggle"
                       hidden>
                <div class="btn-group w-100 mb-4 toggle-buttons"
                     role="group">
                    <label for="tab-login"
                           class="btn btn-outline-primary label-login">
                        Log In
                    </label>
                    <label for="tab-signup"
                           class="btn btn-outline-primary label-signup">
                        Sign Up
                    </label>
                </div>

                <form class="login-form">
                    <h3 class="mb-3 text-center">
                        Welcome Back
                    </h3>
                    <p class="text-center text-muted small">
                        Log in to continue to your account.
                    </p>
                    <div class="mb-3">
                        <label for="loginEmail"
                               class="form-label fw-semibold">
                            Email Address
                        </label>
                        <input type="email"
                               id="loginEmail"
                               class="form-control"
                               required
                               placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword"
                               class="form-label fw-semibold">
                            Password
                        </label>
                        <input type="password"
                               id="loginPassword"
                               class="form-control"
                               required
                               placeholder="Enter password">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input"
                               type="checkbox"
                               id="rememberMe">
                        <label class="form-check-label"
                               for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="landing.html"
                       class="btn btn-primary w-100">
                        Log In
                    </a>
                </form>
                <form class="signup-form">
                    <h3 class="mb-3 text-center">
                        Create Account
                    </h3>
                    <p class="text-center text-muted small">
                        Create your account to get started.
                    </p>
                    <div class="mb-3">
                        <label for="fullName"
                               class="form-label fw-semibold">
                            Full Name
                        </label>
                        <input type="text"
                               id="fullName"
                               class="form-control"
                               required
                               placeholder="John Doe">
                    </div>

                    <div class="mb-3">
                        <label for="signupEmail"
                               class="form-label fw-semibold">
                            Email Address
                        </label>

                        <input type="email"
                               id="signupEmail"
                               class="form-control"
                               required
                               placeholder="name@example.com">
                    </div>

                    <div class="mb-3">
                        <label for="signupPassword"
                               class="form-label fw-semibold">
                            Password
                        </label>

                        <input type="password"
                               id="signupPassword"
                               class="form-control"
                               required
                               placeholder="Create password">
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input"
                               type="checkbox"
                               id="terms"
                               required>

                        <label class="form-check-label"
                               for="terms">
                            I agree to the terms and conditions.
                        </label>
                    </div>

                    <a href="landing.html"
                       class="btn btn-success w-100">
                        Register
                    </a>
                </form>

            </div>

            <div class="card-footer text-center text-muted small">
                ©GomezGlenMidtermAct32026AllRightReserves
            </div>

        </div>

    </main>

</body>
</html>
